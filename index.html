<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Real Estate Management</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    .pm-form { display: grid; gap: .5rem; max-width: 420px; margin: 1rem 0; }
    .pm-form label { display: grid; gap: .2rem; }
    .pm-error { color: #b00020; }
    .pm-summary { display: flex; gap: 1rem; flex-wrap: wrap; }
    .pm-filters { display: flex; gap: .5rem; margin: 1rem 0; }
    .pm-table { width: 100%; border-collapse: collapse; }
    .pm-table th, .pm-table td { text-align: left; padding: .4rem; border-bottom: 1px solid #ddd; }
    .pm-badge { padding: .1rem .5rem; border-radius: 1rem; background: #eee; }
    .pm-available { background: #d4f4dd; } .pm-occupied { background: #d6e4ff; }
    .pm-maintenance { background: #fff0c2; } .pm-sold { background: #e0e0e0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { PropertyManagement, PropertyStore } from './src/property-management/index.js';
    new PropertyManagement(document.getElementById('app'), {
      store: new PropertyStore([], window.localStorage),
    });
  </script>
</body>
</html>
